<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nghe Nhạc YouTube — Chỉ Âm Thanh</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:Segoe UI, sans-serif;}
        body {background:linear-gradient(135deg, #0f0f23, #1a1a3c); color:#fff; min-height:100vh; padding:20px; padding-bottom:100px;}
        .container {max-width:900px; margin:0 auto;}
        h1 {text-align:center; margin-bottom:25px; color:#ff0055;}
        
        /* ===== Thanh tìm kiếm ===== */
        .search-box {display:flex; gap:10px; margin-bottom:30px;}
        .search-box input {flex:1; padding:14px 20px; border:none; border-radius:50px; font-size:16px; background:rgba(255,255,255,.1); color:#fff; outline:none;}
        .search-box button {padding:14px 28px; border:none; border-radius:50px; background:linear-gradient(90deg, #ff0055, #ff4d79); color:#fff; font-size:16px; cursor:pointer; transition:.3s;}
        .search-box button:hover {transform:scale(1.05);}
        
        /* ===== Danh sách bài hát ===== */
        .results {display:flex; flex-direction:column; gap:12px;}
        .song-item {display:flex; align-items:center; gap:15px; padding:12px; background:rgba(255,255,255,.05); border-radius:10px; cursor:pointer; transition:.3s;}
        .song-item:hover, .song-item.active {background:rgba(255,0,85,.2); transform:translateX(5px);}
        .song-thumb {width:100px; height:60px; border-radius:6px; object-fit:cover; background:#333;}
        .song-info {flex:1; overflow:hidden;}
        .song-title {font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
        .song-channel {font-size:12px; color:#aaa; margin-top:4px;}
        
        /* ===== Thanh phát nhạc cố định dưới ===== */
        .player-bar {position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,.95); padding:15px 20px; border-top:1px solid rgba(255,255,255,.1); backdrop-filter:blur(20px); z-index:100;}
        .player-content {max-width:900px; margin:0 auto; display:flex; align-items:center; gap:15px; flex-wrap:wrap;}
        .player-thumb {width:55px; height:55px; border-radius:8px; object-fit:cover;}
        .player-info {min-width:150px;}
        .player-info h4 {font-size:14px;}
        .player-info p {font-size:12px; color:#aaa;}
        .controls {display:flex; align-items:center; gap:12px;}
        .control-btn {background:none; border:none; color:#fff; font-size:22px; cursor:pointer; transition:.2s;}
        .control-btn:hover {color:#ff0055;}
        .play-btn {width:45px; height:45px; border-radius:50%; background:#ff0055; display:flex; align-items:center; justify-content:center; font-size:18px;}
        
        /* ===== KHUNG VIDEO ẨN HOÀN TOÀN ===== */
        .player-container {display:none;} /* ✅ Ẩn khung video */
        
        /* ===== Thanh tiến độ ===== */
        .progress-area {flex:1; display:flex; flex-direction:column; gap:5px; min-width:150px;}
        .progress-bar {width:100%; height:6px; background:#444; border-radius:3px; cursor:pointer;}
        .progress-fill {height:100%; width:0%; background:#ff0055; border-radius:3px; transition:width .1s;}
        .time {display:flex; justify-content:space-between; font-size:11px; color:#aaa; margin-top:3px;}
        
        /* ===== Thông báo lỗi ===== */
        .error {color:#ff6666; font-size:11px; margin-top:3px;}
        
        /* Responsive */
        @media (max-width:768px) {
            .progress-area {width:100%; order:4; margin-top:10px;}
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Nghe Nhạc YouTube — Chỉ Âm Thanh</h1>

    <!-- Thanh tìm kiếm -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm bài hát, ca sĩ...">
        <button id="searchBtn">Tìm</button>
    </div>

    <!-- Danh sách kết quả -->
    <div class="results" id="results">
        <p style="text-align:center; color:#aaa; padding:30px;">Nhập tên bài hát để tìm kiếm 🔍</p>
    </div>
</div>

<!-- Thanh phát nhạc dưới cùng -->
<div class="player-bar" id="playerBar" style="display:none;">
    <div class="player-content">
        <img class="player-thumb" id="playerThumb" alt="">
        <div class="player-info">
            <h4 id="playerTitle"></h4>
            <p id="playerChannel"></p>
            <p class="error" id="errorMsg"></p>
        </div>

        <div class="controls">
            <button class="control-btn" id="prevBtn">⏮</button>
            <button class="control-btn play-btn" id="playBtn">▶</button>
            <button class="control-btn" id="nextBtn">⏭</button>
        </div>

        <!-- Thanh tiến độ thời gian -->
        <div class="progress-area">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>
    </div>
</div>

<!-- KHUNG VIDEO ẨN ĐI — CHỈ PHÁT ÂM THANH -->
<div class="player-container" id="playerContainer"></div>

<script>
const API_KEY = "AIzaSyBna3fWAUyMfy4khuYSJEG1r6lHYIBTqVo";
const API_SEARCH_URL = "https://www.googleapis.com/youtube/v3/search";

let player, currentIndex = 0, results = [], isPlaying = false, isApiReady = false;

// ===== Tải YouTube API =====
function loadAPI(){const s=document.createElement('script');s.src="https://www.youtube.com/player_api";document.head.appendChild(s);}
loadAPI();
window.onYouTubePlayerAPIReady=()=>{isApiReady=true;console.log("✅ API sẵn sàng");};

// ===== Tìm kiếm bài hát =====
async function searchMusic(q){
    const r=document.getElementById('results');
    r.innerHTML='<p style="text-align:center; padding:20px; color:#aaa;">🔄 Đang tìm kiếm...</p>';
    try{
        const u=`${API_SEARCH_URL}?part=snippet&q=${encodeURIComponent(q)}&type=video&videoCategoryId=10&maxResults=15&key=${API_KEY}`;
        const res=await fetch(u), d=await res.json();
        if(!d.items) return r.innerHTML='<p style="text-align:center; color:red;">Không tìm thấy kết quả</p>';
        results=d.items; renderResults();
    }catch(e){r.innerHTML=`<p style="text-align:center; color:red;">Lỗi: ${e.message}</p>`;}
}

// ===== Hiển thị danh sách =====
function renderResults(){
    const r=document.getElementById('results'); r.innerHTML='';
    results.forEach((item,i)=>{
        const s=item.snippet;
        r.innerHTML+=`
        <div class="song-item" data-idx="${i}" data-vid="${item.id.videoId}">
            <img class="song-thumb" src="${s.thumbnails.medium.url}" alt="">
            <div class="song-info">
                <div class="song-title">${s.title}</div>
                <div class="song-channel">${s.channelTitle}</div>
            </div>
        </div>`;
    });
    document.querySelectorAll('.song-item').forEach(el=>{
        el.onclick=()=>playVideo(parseInt(el.dataset.idx));
    });
}

// ===== Phát nhạc (ẨN VIDEO) =====
function playVideo(idx){
    currentIndex=idx;
    const item=results[idx], vid=item.id.videoId, s=item.snippet;
    
    // Cập nhật thông tin thanh phát
    document.getElementById('playerThumb').src=s.thumbnails.default.url;
    document.getElementById('playerTitle').textContent=s.title;
    document.getElementById('playerChannel').textContent=s.channelTitle;
    document.getElementById('playerBar').style.display='block';
    document.getElementById('errorMsg').textContent='';
    document.querySelectorAll('.song-item').forEach((e,i)=>e.classList.toggle('active',i===idx));

    if(!isApiReady || typeof YT==='undefined'){
        document.getElementById('errorMsg').textContent='⏳ Đang tải... thử lại giây lát';
        return setTimeout(()=>playVideo(idx),1200);
    }

    try{
        if(player) player.loadVideoById(vid);
        else{
            player=new YT.Player('playerContainer',{
                width:'1', height:'1', // ✅ Thu nhỏ đến mức không thấy được
                videoId:vid,
                playerVars:{
                    autoplay:1,
                    playsinline:1,
                    rel:0,
                    disablekb:1,
                    controls:0,
                    modestbranding:1,
                    origin:window.location.origin
                },
                events:{
                    onReady:e=>{isPlaying=true; updateBtn(); e.target.playVideo();},
                    onStateChange:e=>{
                        // Cập nhật thanh tiến độ
                        if(e.data===YT.PlayerState.PLAYING) updateProgressTime();
                        // Tự động chuyển bài khi hết
                        if(e.data===YT.PlayerState.ENDED) nextSong();
                        isPlaying=(e.data===YT.PlayerState.PLAYING || e.data===YT.PlayerState.BUFFERING);
                        updateBtn();
                    },
                    onError:e=>{
                        document.getElementById('errorMsg').textContent='⚠️ Video bị chặn nhúng, thử bài khác!';
                        isPlaying=false; updateBtn();
                    }
                }
            });
        }
    }catch(e){document.getElementById('errorMsg').textContent='Lỗi: '+e.message;}
}

// ===== Cập nhật thanh tiến độ & thời gian =====
function updateProgressTime(){
    if(!player || !player.getDuration) return;
    const t=player.getDuration(), c=player.getCurrentTime();
    if(t>0){
        document.getElementById('progressFill').style.width=(c/t*100)+'%';
        document.getElementById('currentTime').textContent=formatTime(c);
        document.getElementById('totalTime').textContent=formatTime(t);
    }
    if(isPlaying) setTimeout(updateProgressTime, 1000);
}

// ===== Định dạng thời gian =====
function formatTime(s){
    const m=Math.floor(s/60), sec=Math.floor(s%60);
    return `${m}:${sec<10?'0':''}${sec}`;
}

// ===== Nhảy đến vị trí =====
document.getElementById('progressBar').onclick=function(e){
    if(!player || !player.getDuration) return;
    const w=this.clientWidth, x=e.offsetX;
    player.seekTo(x/w*player.getDuration());
};

// ===== Nút điều khiển =====
function updateBtn(){document.getElementById('playBtn').textContent=isPlaying?'⏸':'▶';}
function togglePlay(){if(!player)return; isPlaying?player.pauseVideo():player.playVideo();}
function prevSong(){if(!results.length)return; currentIndex=(currentIndex-1+results.length)%results.length; playVideo(currentIndex);}
function nextSong(){if(!results.length)return; currentIndex=(currentIndex+1)%results.length; playVideo(currentIndex);}

// ===== Gán sự kiện =====
document.getElementById('searchBtn').onclick=()=>searchMusic(document.getElementById('searchInput').value);
document.getElementById('searchInput').onkeypress=e=>{if(e.key==='Enter')searchMusic(e.target.value);};
document.getElementById('playBtn').onclick=togglePlay;
document.getElementById('prevBtn').onclick=prevSong;
document.getElementById('nextBtn').onclick=nextSong;
</script>
</body>
</html>
