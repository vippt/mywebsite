<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Nghe Nhạc - YouTube</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
        body {background:#0f0f0f; color:#fff;}
        header {background:#1a1a1a; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
        h1 {font-size:18px; color:#facc15;}
        .search-bar {display:flex; gap:8px; flex:0 0 400px;}
        input {flex:1; padding:10px 14px; border:none; border-radius:6px; background:#272727; color:#fff; font-size:14px;}
        button {padding:10px 18px; border:none; border-radius:6px; background:#facc15; color:#000; font-weight:bold; cursor:pointer;}
        button:hover {background:#fde047;}

        .container {display:flex; gap:16px; padding:16px; max-width:1400px; margin:0 auto;}

        /* === Khung phát bên trái === */
        .player-section {flex:2;}
        .player-wrapper {position:relative; width:100%; padding-bottom:56.25%; border-radius:10px; overflow:hidden; background:#000;}
        .player-wrapper iframe {position:absolute; top:0; left:0; width:100%; height:100%; border:none;}
        .player-info {margin-top:12px;}
        .player-info h2 {font-size:16px; line-height:1.4;}
        .player-info p {color:#aaa; font-size:13px; margin-top:4px;}

        /* === Danh sách bên phải === */
        .related-section {flex:1; min-width:320px;}
        .related-section h3 {font-size:15px; margin-bottom:12px; color:#e2e2e2;}
        .video-item {display:flex; gap:10px; margin-bottom:10px; cursor:pointer; border-radius:6px; padding:4px;}
        .video-item:hover {background:#272727;}
        .video-item img {width:120px; height:68px; object-fit:cover; border-radius:4px;}
        .video-item .meta {flex:1;}
        .video-item .title {font-size:13px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
        .video-item .chan {font-size:12px; color:#aaa; margin-top:4px;}
        .error-msg {color:#ff6b6b; font-size:13px; padding:10px;}

        /* Responsive di động */
        @media (max-width:900px) {
            .container {flex-direction:column;}
            .search-bar {flex:1; min-width:180px;}
        }
    </style>
</head>
<body>

<header>
    <h1>🎵 Nghe Nhạc Online</h1>
    <div class="search-bar">
        <input type="text" id="q" placeholder="Tìm bài hát, ca sĩ...">
        <button onclick="searchNhac()">Tìm</button>
    </div>
</header>

<div class="container">
    <!-- Khung phát bên trái -->
    <div class="player-section">
        <div class="player-wrapper">
            <iframe id="playerFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="player-info">
            <h2 id="vidTitle">Chọn bài hát để phát</h2>
            <p id="vidChannel"></p>
        </div>
    </div>

    <!-- Danh sách bên phải -->
    <div class="related-section">
        <h3 id="listTitle">🔥 Nhạc mới 2026</h3>
        <div id="relatedList"></div>
    </div>
</div>

<script>
// === API Key của bạn ===
const API_KEY = "AIzaSyBna3fWAUyMfy4khuYSJEG1r6lHYIBTqVo";
const API_URL = "https://www.googleapis.com/youtube/v3/search";

// === CHUYỂN TIẾNG VIỆT → KHÔNG DẤU, KHOẢNG CÁCH → GẠCH NGANG ===
function slugify(text) {
    const map = {
        'á':'a','à':'a','ả':'a','ã':'a','ạ':'a','ă':'a','ắ':'a','ằ':'a','ẳ':'a','ẵ':'a','ặ':'a',
        'â':'a','ấ':'a','ầ':'a','ẩ':'a','ẫ':'a','ậ':'a',
        'é':'e','è':'e','ẻ':'e','ẽ':'e','ẹ':'e','ê':'e','ế':'e','ề':'e','ể':'e','ễ':'e','ệ':'e',
        'í':'i','ì':'i','ỉ':'i','ĩ':'i','ị':'i',
        'ó':'o','ò':'o','ỏ':'o','õ':'o','ọ':'o','ô':'o','ố':'o','ồ':'o','ổ':'o','ỗ':'o','ộ':'o',
        'ơ':'o','ớ':'o','ờ':'o','ở':'o','ỡ':'o','ợ':'o',
        'ú':'u','ù':'u','ủ':'u','ũ':'u','ụ':'u','ư':'u','ứ':'u','ừ':'u','ử':'u','ữ':'u','ự':'u',
        'ý':'y','ỳ':'y','ỷ':'y','ỹ':'y','ỵ':'y',
        'đ':'d',
        'Á':'A','À':'A','Ả':'A','Ã':'A','Ạ':'A','Ă':'A','Ắ':'A','Ằ':'A','Ẳ':'A','Ẵ':'A','Ặ':'A',
        'Â':'A','Ấ':'A','Ầ':'A','Ẩ':'A','Ẫ':'A','Ậ':'A',
        'É':'E','È':'E','Ẻ':'E','Ẽ':'E','Ẹ':'E','Ê':'E','Ế':'E','Ề':'E','Ể':'E','Ễ':'E','Ệ':'E',
        'Í':'I','Ì':'I','Ỉ':'I','Ĩ':'I','Ị':'I',
        'Ó':'O','Ò':'O','Ỏ':'O','Õ':'O','Ọ':'O','Ô':'O','Ố':'O','Ồ':'O','Ổ':'O','Ỗ':'O','Ộ':'O',
        'Ơ':'O','Ớ':'O','Ờ':'O','Ở':'O','Ỡ':'O','Ợ':'O',
        'Ú':'U','Ù':'U','Ủ':'U','Ũ':'U','Ụ':'U','Ư':'U','Ứ':'U','Ừ':'U','Ử':'U','Ữ':'U','Ự':'U',
        'Ý':'Y','Ỳ':'Y','Ỷ':'Y','Ỹ':'Y','Ỵ':'Y',
        'Đ':'D'
    };
    return text.split('').map(c => map[c] || c)
        .join('')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
}

function unSlugify(slug) {
    return slug.replace(/-/g, ' ');
}

// === KHỞI ĐỘNG ===
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const watchId = params.get("watch");
    const slugTitle = params.get("title");

    if (watchId && slugTitle) {
        const originalTitle = unSlugify(slugTitle);
        phatVideo(watchId, originalTitle, "YouTube");
        layVideoLienQuanTheoId(watchId, originalTitle);
    } else {
        timKiemTuKhoa("nhạc mới 2026");
    }
};

// === 🔍 TÌM KIẾM THEO TỪ KHÓA ===
function searchNhac() {
    let q = document.getElementById('q').value.trim();
    if(!q) return;
    timKiemTuKhoa(q);
}

function timKiemTuKhoa(tuKhoa) {
    document.getElementById('listTitle').textContent = "🔍 Kết quả cho: " + tuKhoa;
    fetch(`${API_URL}?part=snippet&q=${encodeURIComponent(tuKhoa)}&type=video&maxResults=12&key=${API_KEY}`)
    .then(res => res.json())
    .then(data => {
        if(data.error) throw data.error;
        if(!data.items || data.items.length === 0) {
            document.getElementById('relatedList').innerHTML = "<p>Không tìm thấy kết quả.</p>";
            return;
        }
        hienThiDanhSach(data.items);
    })
    .catch(err => {
        console.error("Lỗi tìm kiếm:", err);
        document.getElementById('relatedList').innerHTML = `<p class="error-msg">Lỗi: ${err.message || "Không thể tải dữ liệu"}</p>`;
    });
}

// === 📺 LẤY VIDEO LIÊN QUAN theo ID ===
function layVideoLienQuanTheoId(videoId, tenVideo) {
    document.getElementById('listTitle').textContent = "📺 Video liên quan đến: " + tenVideo;
    
    // ✅ ĐÚNG CÔNG THỨC API: KHÔNG có q, BẮT BUỘC có type=video
    const url = `${API_URL}?part=snippet&relatedToVideoId=${videoId}&type=video&maxResults=12&key=${API_KEY}`;
    
    console.log("Gọi API video liên quan:", url); // Ghi log để kiểm tra
    
    fetch(url)
    .then(res => res.json())
    .then(data => {
        // Bắt lỗi API trả về rõ ràng
        if(data.error) {
            console.error("Lỗi API:", data.error);
            throw new Error(data.error.message || "Lỗi từ YouTube API");
        }
        
        console.log("Kết quả video liên quan:", data); // Xem phản hồi thực tế
        
        if(!data.items || data.items.length === 0) {
            document.getElementById('relatedList').innerHTML = "<p>ℹ️ Không có video liên quan (hoặc API không trả về kết quả).</p>";
            return;
        }
        hienThiDanhSach(data.items);
    })
    .catch(err => {
        console.error("Lỗi lấy video liên quan:", err);
        document.getElementById('relatedList').innerHTML = `<p class="error-msg">❌ Lỗi: ${err.message}</p>`;
    });
}

// === HIỂN THỊ DANH SÁCH ===
function hienThiDanhSach(items) {
    let html = "";
    items.forEach(item => {
        // Bảo đảm có videoId trước khi hiển thị
        if(!item.id || !item.id.videoId) return;
        
        const vId = item.id.videoId;
        const s = item.snippet;
        html += `
        <div class="video-item" onclick="phatVideoTuList('${vId}', ${JSON.stringify(s.title).replace(/"/g,'&quot;')}, ${JSON.stringify(s.channelTitle).replace(/"/g,'&quot;')})">
            <img src="${s.thumbnails?.medium?.url || ''}" alt="">
            <div class="meta">
                <div class="title">${s.title}</div>
                <div class="chan">${s.channelTitle}</div>
            </div>
        </div>`;
    });
    document.getElementById('relatedList').innerHTML = html || "<p>Không có video nào.</p>";
}

// === PHÁT VIDEO + CẬP NHẬT URL ===
function phatVideoTuList(videoId, title, channel) {
    const slug = slugify(title);
    history.replaceState(null, "", `?watch=${videoId}&title=${slug}`);
    phatVideo(videoId, title, channel);
    layVideoLienQuanTheoId(videoId, title);
}

function phatVideo(videoId, title, channel) {
    const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    document.getElementById('playerFrame').src = embedUrl;
    document.getElementById('vidTitle').textContent = title;
    document.getElementById('vidChannel').textContent = channel;
}

// Nút quay/lùi trình duyệt
window.addEventListener('popstate', () => {
    const params = new URLSearchParams(window.location.search);
    const watchId = params.get("watch");
    const slugTitle = params.get("title");
    if (watchId && slugTitle) {
        const originalTitle = unSlugify(slugTitle);
        phatVideo(watchId, originalTitle, "YouTube");
        layVideoLienQuanTheoId(watchId, originalTitle);
    }
});

// Enter tìm kiếm
document.getElementById('q').addEventListener('keydown', e => {
    if(e.key === 'Enter') searchNhac();
});
</script>
</body>
</html>
