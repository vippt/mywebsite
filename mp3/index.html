<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video - YouTube Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0f0f0f; color: #fff; padding: 20px; }
        .video-player { max-width: 1000px; margin: 0 auto 30px; }
        iframe { width: 100%; height: 500px; border-radius: 12px; border: none; }
        .related-section { max-width: 1000px; margin: 0 auto; }
        .video-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 15px; }
        .video-card { cursor: pointer; border-radius: 8px; overflow: hidden; transition: 0.2s; }
        .video-card:hover { transform: scale(1.03); }
        .video-card img { width: 100%; height: 120px; object-fit: cover; background: #272727; }
        .video-title {
    padding: 8px;
    font-size: 14px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2; /* Hiển thị tối đa 2 dòng */
    overflow: hidden;       /* Ẩn phần chữ thừa */
    text-overflow: ellipsis;/* Thêm dấu ... ở cuối */
    min-height: 40px;       /* Đảm bảo khung đồng đều chiều cao */
}

        .hidden { display: none !important; }
        h2 { margin: 30px 0 10px; font-size: 18px; }
        .back-btn { background: #272727; border: none; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; }
        .back-btn:hover { background: #3f3f3f; }
    </style>
</head>
<body>

<!-- Khung phát video -->
<div class="video-player hidden" id="playerSection">
    <button class="back-btn" onclick="goHome()">← Trở về</button>
    <iframe id="videoFrame" allowfullscreen></iframe>
    <h3 id="videoTitle" style="margin:10px 0;"></h3>
</div>

<!-- Danh sách video liên quan -->
<div class="related-section hidden" id="relatedSection">
    <h3>📺 Video liên quan</h3>
    <div class="video-grid" id="relatedVideos"></div>
</div>

<!-- Trang chủ - 3 hàng video -->
<div id="homePage">
    <h2>🔥 Kênh 1</h2>
    <div class="video-grid" id="channel1"></div>

    <h2>🎵 Nhạc hay 2026</h2>
    <div class="video-grid" id="searchList"></div>

    <h2>📈 Trending</h2>
    <div class="video-grid" id="trendingList"></div>
</div>

<script>
const API_KEY = "AIzaSyBna3fWAUyMfy4khuYSJEG1r6lHYIBTqVo";
let currentVideoId = "";

// ===== Mã hóa title: tiếng Việt → không dấu, khoảng cách thành dấu - =====
function encodeTitle(title) {
    return title.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

// ===== Cập nhật URL → share được! dạng: ?watch=ID&title=ten-video =====
function updateURL(videoId, title) {
    const encodedTitle = encodeTitle(title);
    history.pushState(null, "", `?watch=${videoId}&title=${encodedTitle}`);
}

// ===== Đọc tham số từ URL khi mở trang =====
function getParamsFromURL() {
    const params = new URLSearchParams(window.location.search);
    return {
        videoId: params.get("watch"),
        title: params.get("title") ? params.get("title").replace(/-/g, " ") : ""
    };
}

// ===== Phát video =====
async function playVideo(videoId, rawTitle = "") {
    currentVideoId = videoId;
    const title = rawTitle || "Video";
    
    // Cập nhật URL → copy & share được
    updateURL(videoId, title);
    
    // Hiện player, ẩn trang chủ
    document.getElementById("playerSection").classList.remove("hidden");
    document.getElementById("relatedSection").classList.remove("hidden");
    document.getElementById("homePage").classList.add("hidden");
    
    // Phát video
    document.getElementById("videoFrame").src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    document.getElementById("videoTitle").textContent = title;
    
    // Tải video liên quan
    loadRelatedVideos(videoId);
}

// ===== Tải video liên quan =====
async function loadRelatedVideos(videoId) {
    try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&relatedToVideoId=${videoId}&type=video&maxResults=15&key=${API_KEY}`);
        const data = await res.json();
        if (data.error) throw data.error;
        renderVideoList(data.items, "relatedVideos");
    } catch (e) {
        document.getElementById("relatedVideos").innerHTML = `<p>Lỗi tải video liên quan: ${e.message}</p>`;
    }
}

// ===== Hiển thị danh sách video =====
function renderVideoList(videos, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = videos.map(v => {
        const id = v.id.videoId;
        const title = v.snippet.title.replace(/'/g, "\\'").replace(/"/g, '\\"');
        const thumb = v.snippet.thumbnails.medium.url;
        return `
            <div class="video-card" onclick="playVideo('${id}', '${title}')">
                <img src="${thumb}" alt="${v.snippet.title}">
                <div class="video-title">${v.snippet.title}</div>
            </div>
        `;
    }).join("");
}

// ===== Tải trang chủ =====
async function loadHomePage() {
    // Hàng 1: Kênh 1 — thay channelId của bạn
    const ch1 = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=UC-8Qv...&maxResults=5&key=${API_KEY}`).then(r=>r.json());
    renderVideoList(ch1.items, "channel1");

    // Hàng 2: Tìm "nhạc hay 2026"
    const search = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=nhạc hay 2026&maxResults=5&key=${API_KEY}`).then(r=>r.json());
    renderVideoList(search.items, "searchList");

    // Hàng 3: Trending Việt Nam
    const trend = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&maxResults=5&regionCode=VN&key=${API_KEY}`).then(r=>r.json());
    renderVideoList(trend.items.map(item => ({...item, id: {videoId: item.id}})), "trendingList");
}

// ===== Trở về trang chủ =====
function goHome() {
    history.pushState(null, "", window.location.pathname);
    document.getElementById("playerSection").classList.add("hidden");
    document.getElementById("relatedSection").classList.add("hidden");
    document.getElementById("homePage").classList.remove("hidden");
    document.getElementById("videoFrame").src = "";
    currentVideoId = "";
}

// ===== Nút quay lại/trước của trình duyệt =====
window.addEventListener("popstate", () => {
    const { videoId } = getParamsFromURL();
    if (!videoId) goHome();
});

// ===== KHỞI ĐỘNG: Đọc URL ngay khi mở trang =====
window.addEventListener("load", () => {
    const { videoId, title } = getParamsFromURL();
    if (videoId) {
        // Có tham số trong link → tự động phát (dùng cho share link)
        playVideo(videoId, title);
    } else {
        // Không có → tải trang chủ
        loadHomePage();
    }
});
</script>
</body>
</html>
